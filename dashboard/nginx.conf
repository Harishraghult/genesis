# Cache policy by path (set at server level so the security headers below still apply everywhere;
# an add_header inside a location block would drop all of them).
map $uri $focuslock_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/models/ "public, max-age=604800";
    ~^/api/    "";
    default    "no-cache";
}

server {
    access_log off;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), bluetooth=(), usb=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $focuslock_cache always;
    location /api/ { proxy_pass http://api:8000/; }
    # Face-check runtime: module scripts and WebAssembly need exact types (nosniff).
    location ~* \.mjs$ { default_type text/javascript; try_files $uri =404; }
    location ~* \.wasm$ { default_type application/wasm; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
